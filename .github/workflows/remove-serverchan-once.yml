name: Remove ServerChan integration once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/remove-serverchan-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove ServerChan integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # checkin.py: remove ServerChan implementation and invocation.
          p = Path('checkin.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('支持 Server酱 / 飞书 推送通知', '支持飞书推送通知')
          s = re.sub(
              r'\nasync def send_serverchan\(title: str, content: str\):\n.*?\n\ndef _build_feishu_card',
              '\n\ndef _build_feishu_card',
              s,
              flags=re.S,
          )
          s = s.replace('    # Server酱 推送\n', '    # 飞书推送\n')
          s = s.replace('    await send_serverchan(title, content)\n', '')
          p.write_text(s, encoding='utf-8')

          # Local PowerShell helper: remove the ServerChan env override.
          p = Path('scripts/run_agentrouter_local.ps1')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'^\s*\$env:SERVERCHAN_KEY\s*=.*\n', '', s, flags=re.M)
              p.write_text(s, encoding='utf-8')

          # .env.example: remove the ServerChan example block.
          p = Path('.env.example')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(
                  r'\n# ----- 可选:Server 酱推送 -----\n# .*?\nSERVERCHAN_KEY=\n',
                  '\n',
                  s,
                  flags=re.S,
              )
              p.write_text(s, encoding='utf-8')

          # README: remove feature bullet, secret row and dedicated ServerChan section.
          p = Path('README.md')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'^- 📢 \*\*Server 酱推送\*\*.*\n', '', s, flags=re.M)
              s = re.sub(r'^\| `SERVERCHAN_KEY` \|.*\n', '', s, flags=re.M)
              s = re.sub(
                  r'\n### Server 酱\n.*?(?=\n### 飞书 / Lark 自定义机器人 Webhook)',
                  '\n',
                  s,
                  flags=re.S,
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify no ServerChan references remain outside this one-time workflow
        shell: bash
        run: |
          if grep -RniE 'SERVERCHAN|Server ?酱|send_serverchan' --exclude-dir=.git --exclude='remove-serverchan-once.yml' .; then
            echo 'ServerChan references still remain.'
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkin.py README.md .env.example scripts/run_agentrouter_local.ps1
          git commit -m 'chore: remove ServerChan integration'
          git push origin HEAD:master
